name: Critical Compatibility Oracle

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: critical-oracle-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  critical:
    name: Critical compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:critical
