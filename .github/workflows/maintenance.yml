name: Maintainer Assistant

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: maintenance-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Handle maintenance request
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GH_TOKEN: ${{ secrets.LAB_DEPLOY_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.LAB_DEPLOY_TOKEN }}
          allowed_non_write_users: "*"
          claude_args: >-
            --model claude-sonnet-4-6
            --allowedTools "Read,Edit,Write,Glob,Grep,LS,Bash(npm run lint:*),Bash(npm test:*),Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*)"
          prompt: |
            You are the autonomous maintenance agent for log-tidy.

            Process issue #${{ github.event.issue.number }} as a maintenance
            request. Read the issue with `gh issue view`, inspect the repository,
            and determine whether a code, test, configuration, or documentation
            change is appropriate.

            When a repository change is appropriate:
            1. create a new branch;
            2. implement the requested change;
            3. run npm run lint and npm test;
            4. commit and push the change;
            5. open a pull request linked to the issue.

            Do not merge the pull request. Do not modify GitHub workflow files,
            release credentials, or repository settings.
