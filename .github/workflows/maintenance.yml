name: Maintainer Assistant

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue to process
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: maintenance-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Load issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          gh issue view "$ISSUE_NUMBER" --json number,title,body > issue.json

      - name: Generate and apply maintenance change
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: node scripts/single-pass-maintainer.mjs

      - name: Validate proposed change
        if: steps.agent.outputs.result_type == 'repository_change'
        run: |
          npm run lint
          timeout 180 npm test

      - name: Commit and push branch
        if: steps.agent.outputs.result_type == 'repository_change'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          branch="agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git config user.name "maintenance-agent[bot]"
          git config user.email "maintenance-agent[bot]@users.noreply.github.com"
          jq -r '.files[]' proposal.json | xargs git add --
          git diff --cached --quiet && { echo "Model produced no repository change"; exit 1; }
          git commit -m "$(jq -r '.commit_message' proposal.json)"
          git push origin HEAD
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Open pull request
        if: steps.agent.outputs.result_type == 'repository_change'
        env:
          GH_TOKEN: ${{ secrets.LAB_DEPLOY_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          title=$(jq -r '.pr_title' proposal.json)
          body=$(jq -r '.pr_body' proposal.json)
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body "$body\n\nCloses #$ISSUE_NUMBER"

      - name: Create follow-up issues
        if: steps.agent.outputs.result_type == 'followup_issues'
        env:
          GH_TOKEN: ${{ secrets.LAB_DEPLOY_TOKEN }}
        run: node scripts/create-followup-issues.mjs
