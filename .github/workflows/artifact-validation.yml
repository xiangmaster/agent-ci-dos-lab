name: Artifact Validation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  validate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted consumer
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: package-candidate
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Validate manifest and package digest
        run: node scripts/validate-package-manifest.mjs artifacts
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and execute package in independent consumer
        run: node scripts/consume-package-candidate.mjs artifacts
      - name: Upload downstream consumer result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c4-consumer-result-${{ github.event.workflow_run.id }}
          path: c4-consumer-result.json
          retention-days: 30
          if-no-files-found: warn
