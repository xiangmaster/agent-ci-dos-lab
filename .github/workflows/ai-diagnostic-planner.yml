name: AI Diagnostic Planner

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-diagnostic-planner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted planner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch pull request diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api
          -H "Accept: application/vnd.github.v3.diff"
          "repos/${REPOSITORY}/pulls/${PR_NUMBER}"
          > pr.diff

      - name: Generate diagnostic notification plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: node scripts/plan-diagnostic-notification.mjs

      - name: Upload notification plan
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-notification-plan
          path: notification-plan.json
          retention-days: 14
          if-no-files-found: error
